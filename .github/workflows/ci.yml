name: CI

# Verification only. This workflow never deploys. Deployment stays a manual,
# separately-authorized step (`npm run deploy` after the release gate passes).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Dependency pin guard (known-good runtime pair)
        run: npm run verify:deps

      - name: Worker runtime smoke (build + workerd + critical routes + love isolation)
        run: npm run verify:worker-runtime

      - name: Source cleanliness (no whitespace errors)
        run: git diff --check
